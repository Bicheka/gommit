name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: gommit
            asset_name: gommit-linux-amd64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gommit
            asset_name: gommit-macos-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gommit
            asset_name: gommit-macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gommit.exe
            asset_name: gommit-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build project
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        shell: bash
        run: |
          mkdir -p release-files
          find dist -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Generate checksums.txt
        shell: bash
        run: |
          cd release-files
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*
            - name: Create GitHub Release and upload assets
            uses: softprops/action-gh-release@v2
            with:
              name: Release ${{ github.ref_name }}
              tag_name: ${{ github.ref_name }}
              files: |
                release-files/*