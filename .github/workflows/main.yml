name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset_name: gommit-linux-amd64
            output_name: gommit

          - os: macos-latest
            target: bun-darwin-x64
            asset_name: gommit-macos-amd64
            output_name: gommit

          - os: macos-latest
            target: bun-darwin-arm64
            asset_name: gommit-macos-arm64
            output_name: gommit

          - os: windows-latest
            target: bun-windows-x64
            asset_name: gommit-windows-amd64.exe
            output_name: gommit.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.output_name }}

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ matrix.output_name }} dist/${{ matrix.asset_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        shell: bash
        run: |
          mkdir -p release-files
          find dist -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Generate checksums.txt
        shell: bash
        run: |
          cd release-files
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            release-files/*